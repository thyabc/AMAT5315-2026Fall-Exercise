[package]
name = "infer"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"

[dependencies]
tenferro-runtime = { version = "=0.7.1", default-features = false, features = ["cpu-faer"] }
tenferro-cpu = { version = "=0.7.1", default-features = false, features = ["cpu-faer"] }
tenferro-tensor = "=0.7.1"
tenferro-einsum = { version = "=0.7.1", default-features = false, features = ["cpu-faer"] }

omeco = "=0.2.6"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
