[package]
name = "seismic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ndarray = "0.17.2"
ndarray-npy = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[[bin]]
name = "seismic"
path = "src/main.rs"
test = false

[[bin]]
name = "enzyme-smoke"
path = "src/bin/enzyme_smoke.rs"
test = false
[[bin]]
name = "timestep-smoke"
path = "src/bin/timestep_smoke.rs"
test = false
